# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # The 10.x preset requires conventional-changelog-writer@9+, but
      # @semantic-release/release-notes-generator still depends on ^8.0.0.
      # Pairing them silently drops every commit from the release notes.
      # Remove this once release-notes-generator ships a writer 9 dependency.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      release-tools:
        patterns:
          - "@commitlint/*"
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"
      build-tools:
        patterns:
          - "@types/*"
          - "@tsconfig/*"
          - "ts-node"
          - "typescript"
        exclude-patterns:
          - "@types/chai"
          - "@types/mocha"
          - "@types/sinon"
          - "@types/sinon-chai"
      lint-tools:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      test-tools:
        patterns:
          - "chai"
          - "@types/chai"
          - "@istanbuljs/nyc-config-typescript"
          - "nyc"
          - "mocha"
          - "@types/mocha"
          - "sinon"
          - "@types/sinon"
          - "sinon-chai"
          - "@types/sinon-chai"
